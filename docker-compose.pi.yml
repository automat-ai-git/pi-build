networks:
  localai_default:
    external: true

volumes:
  tg_socket_data:
    external: true
    name: tg-cli_tg_socket_data

services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi
    restart: unless-stopped
    stdin_open: true
    tty: true
    group_add:
      - "${DOCKER_GID:-1001}"
      - "2000"
    networks:
      - localai_default
    ports:
      - "7683:7681"
    volumes:
      - ${HOST_HOME:?HOST_HOME не задан — скопируй .env.example в .env и укажи HOST_HOME}/workspace:/workspace
      - ${HOST_HOME}/pi-build/agent:/home/pi/.pi/agent
      - ${HOST_HOME}:/host
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEETING_DATA:-/dev/null}:/meeting-data:ro
      - tg_socket_data:/tmp/tg-socket   # общий Unix-сокет tg-cli daemon (volume tg-cli_tg_socket_data)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOME=/home/pi
      - HOST_HOME=${HOST_HOME}
      - TG_DAEMON_SOCKET=/tmp/tg-socket/tg-cli.sock

      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      - PI_TELEMETRY=false
      - PI_SKIP_VERSION_CHECK=true

      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-}
      - PLANE_BASE_URL=${PLANE_BASE_URL:-}
